<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hẹn giờ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f1e8; --card:#fffdf7; --ink:#2d2119; --line:#e5d9c3;
  --accent:#0f766e; --accent-soft:#e0f2f0; --muted:#8a7a63;
  --ok:#1e7e34; --err:#c0392b;
}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,Roboto,"Segoe UI",sans-serif;min-height:100vh;font-size:15px}
.hero{padding:32px 22px 18px;display:flex;align-items:center;gap:14px}
.hero-icon{width:52px;height:52px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 12px rgba(15,118,110,.3);flex-shrink:0}
.hero h1{font-size:24px;font-weight:700;letter-spacing:-.3px}
.hero p{font-size:12.5px;color:var(--muted);margin-top:3px}
#taskList{padding:4px 16px 110px;max-width:640px;margin:0 auto}
.task{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(45,33,25,.05);position:relative;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:.9}
.task.off::before{background:#c9bda8;opacity:.5}
.task.off{opacity:.75}
.task-top{display:flex;align-items:flex-start;gap:10px}
.task-name{font-size:16.5px;font-weight:700;flex:1;line-height:1.35}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:20px;margin-top:8px;margin-right:6px}
.pill.sched{background:var(--accent-soft);color:var(--accent)}
.pill.next{background:#fef3e2;color:#b45309}
.task-desc{font-size:13px;color:var(--muted);margin-top:8px;font-family:ui-monospace,monospace;word-break:break-all;line-height:1.5}
.task-result{font-size:12.5px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot.ok{background:var(--ok)} .dot.err{background:var(--err)}
.task-result .ok{color:var(--ok)} .task-result .err{color:var(--err)}
.task-result time{margin-left:auto;color:var(--muted);font-size:11.5px}
.task-actions{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;font-size:13.5px;font-weight:600;color:var(--ink)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.switch{position:relative;width:48px;height:28px;flex-shrink:0;margin-top:2px}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#ddd0b8;border-radius:28px;transition:.2s;cursor:pointer}
.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.slider{background:var(--accent)}
.switch input:checked+.slider:before{transform:translateX(20px)}
.empty{text-align:center;padding:70px 30px;color:var(--muted)}
.empty .big{font-size:44px;margin-bottom:14px}
.empty p{font-size:14px;line-height:1.8}
.fab{position:fixed;right:20px;bottom:26px;width:60px;height:60px;border-radius:50%;background:var(--accent);color:#fff;font-size:32px;font-weight:300;border:none;box-shadow:0 6px 18px rgba(15,118,110,.4);z-index:50;line-height:1}
.fab:active{transform:scale(.94)}
.sheet-backdrop{position:fixed;inset:0;background:rgba(45,33,25,.45);z-index:100;display:flex;align-items:flex-end;backdrop-filter:blur(2px)}
.sheet{background:var(--card);border-radius:24px 24px 0 0;width:100%;max-width:640px;margin:0 auto;max-height:92vh;overflow-y:auto;padding:22px 22px 36px;animation:up .25s ease;position:relative}
@keyframes up{from{transform:translateY(50px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-size:19px;margin-bottom:18px;letter-spacing:-.2px}
.sec{background:var(--bg);border-radius:14px;padding:14px;margin-bottom:14px}
.sec-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:10px}
.f-row{margin-bottom:12px}
.f-row:last-child{margin-bottom:0}
.f-row label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink);opacity:.85}
.f-row input[type=text],.f-row input[type=url],.f-row input[type=number],.f-row input[type=time],.f-row input[type=datetime-local],.f-row textarea,.f-row select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
.f-row input:focus,.f-row textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.f-row textarea{font-family:ui-monospace,monospace;font-size:13px;resize:vertical}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.days{display:flex;gap:8px;justify-content:space-between}
.days button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:700;color:var(--muted)}
.days button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.row-between{display:flex;align-items:center;justify-content:space-between}
.big-btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;margin-top:6px;box-shadow:0 4px 12px rgba(15,118,110,.3)}
.big-btn:active{transform:scale(.98)}
.ghost-btn{width:100%;border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:14px;padding:12px;font-size:14px;font-weight:600;margin-top:10px}
.danger-link{display:block;width:100%;background:none;border:none;color:var(--err);font-size:14px;padding:14px;margin-top:6px}
.sheet-close{position:absolute;right:14px;top:12px;border:none;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:15px;color:var(--muted)}
.hidden{display:none!important}
.note{font-size:12px;color:var(--muted);line-height:1.7;background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:14px}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-icon">⏰</div>
  <div><h1>Hẹn giờ</h1><p id="subtitle">Chạy tác vụ theo lịch tự động</p></div>
</div>
<div id="taskList"></div>
<button class="fab" onclick="openSheet()">+</button>

<div id="sheet" class="sheet-backdrop hidden" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <div class="grab"></div>
    <button class="sheet-close" onclick="closeSheet()">✕</button>
    <h2 id="sheetTitle">Tác vụ mới</h2>

    <div class="sec">
      <div class="sec-title">Chung</div>
      <div class="f-row"><label>Tên tác vụ</label><input type="text" id="fName" placeholder="VD: Gọi API báo cáo sáng"></div>
      <div class="f-row row-between"><label style="margin:0">Bật tác vụ</label>
        <span class="switch"><input type="checkbox" id="fEnabled" checked><span class="slider"></span></span></div>
    </div>

    <div class="sec">
      <div class="sec-title">Tác vụ làm gì</div>
      <div class="f-row"><div class="seg" id="segAction">
        <button data-v="http" class="active">🌐 Gọi API</button>
        <button data-v="open_url">🔗 Mở link</button>
        <button data-v="notify">🔔 Thông báo</button>
      </div></div>
      <div id="boxHttp">
        <div class="f-row"><div class="seg" id="segMethod">
          <button data-v="GET" class="active">GET</button>
          <button data-v="POST">POST</button>
          <button data-v="PUT">PUT</button>
          <button data-v="DELETE">DEL</button>
        </div></div>
        <div class="f-row"><label>URL</label><input type="url" id="fUrl" placeholder="https://example.com/api" autocapitalize="off" spellcheck="false"></div>
        <div class="f-row"><label>Headers <span style="font-weight:400;color:var(--muted)">(JSON)</span></label><textarea id="fHeaders" rows="2" placeholder='{"Authorization": "Bearer xxx"}' spellcheck="false"></textarea></div>
        <div class="f-row"><label>Body</label><textarea id="fBody" rows="3" placeholder='{"key": "value"}' spellcheck="false"></textarea></div>
      </div>
      <div id="boxUrl" class="hidden">
        <div class="f-row"><label>Link cần mở</label><input type="url" id="fOpenUrl" placeholder="https://example.com" autocapitalize="off" spellcheck="false"></div>
      </div>
      <div id="boxNotify" class="hidden">
        <div class="f-row"><label>Nội dung thông báo</label><input type="text" id="fMsg" placeholder="Đến giờ rồi!"></div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-title">Lịch chạy</div>
      <div class="f-row"><div class="seg" id="segSched">
        <button data-v="once" class="active">1 lần</button>
        <button data-v="daily">Hằng ngày</button>
        <button data-v="weekly">Hằng tuần</button>
        <button data-v="interval">Định kỳ</button>
      </div></div>
      <div id="boxOnce"><div class="f-row"><label>Ngày giờ chạy</label><input type="datetime-local" id="fOnce"></div></div>
      <div id="boxDaily" class="hidden"><div class="f-row"><label>Giờ chạy mỗi ngày</label><input type="time" id="fDaily" value="08:00"></div></div>
      <div id="boxWeekly" class="hidden">
        <div class="f-row"><label>Ngày trong tuần</label><div class="days" id="fDays"></div></div>
        <div class="f-row"><label>Giờ chạy</label><input type="time" id="fWeekly" value="08:00"></div>
      </div>
      <div id="boxInterval" class="hidden"><div class="f-row"><label>Mỗi bao nhiêu phút <span style="font-weight:400;color:var(--muted)">(tối thiểu 15)</span></label><input type="number" id="fMinutes" value="30" min="15"></div></div>
    </div>

    <button class="ghost-btn" onclick="testNow()">▶ Chạy thử ngay</button>
    <button class="big-btn" onclick="saveTask()">Lưu tác vụ</button>
    <button class="danger-link hidden" id="btnDelete" onclick="deleteTask()">Xóa tác vụ này</button>
    <div class="note" id="bgNote">💡 Bản web: tác vụ chạy khi đang mở trang. Muốn chạy ngầm 24/7 thì dùng bản chạy trên máy chủ (GitHub Actions).</div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
